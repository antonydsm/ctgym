appId: com.ctgym.app
productName: CT GYM
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/**/*
  - '!resources/chromium/**/*'
  - package.json
extraResources:
  - from: resources/chromium
    to: chromium
win:
  icon: resources/icon.ico
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerSidebar: resources/nsis-sidebar.bmp
  uninstallerSidebar: resources/nsis-sidebar.bmp
  artifactName: 'CT GYM Setup ${version}.${ext}'
publish:
  provider: github
  owner: antonydsm
  repo: ctgym
